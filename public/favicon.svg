<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brutalist offset shadow -->
  <rect x="8" y="8" width="56" height="56" fill="#0a0a0a"/>
  <!-- Yellow tile with thick black border -->
  <rect x="2" y="2" width="56" height="56" fill="#ffe800" stroke="#0a0a0a" stroke-width="3"/>
  <!-- Bold "M" stroke -->
  <path
    d="M 14 50 L 14 14 L 32 32 L 50 14 L 50 50"
    fill="none"
    stroke="#0a0a0a"
    stroke-width="8"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <!-- Yellow accent square in upper-right -->
  <rect x="44" y="6" width="8" height="8" fill="#ffe800" stroke="#0a0a0a" stroke-width="2"/>
</svg>
